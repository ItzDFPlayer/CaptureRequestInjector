name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (e.g., 100)'
        required: true
        default: '100'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Update version in build.gradle.kts
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ github.event.inputs.version_name }}\"/g" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/g" app/build.gradle.kts
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureRequestInjector-v${{ github.event.inputs.version_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
